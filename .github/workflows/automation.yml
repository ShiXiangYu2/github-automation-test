name: Automation

on:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Issue opened
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: |
          echo "Issue #${{ github.event.issue.number }} opened"
          echo "Adding needs-triage label..."
          gh issue edit ${{ github.event.issue.number }} --add-label "needs-triage"

      - name: Issue closed
        if: github.event_name == 'issues' && github.event.action == 'closed'
        run: |
          echo "Issue #${{ github.event.issue.number }} closed"

      - name: PR closed
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          echo "PR #${{ github.event.pull_request.number }} closed, merged: ${{ github.event.pull_request.merged }}"

      - name: PR opened
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          echo "PR #${{ github.event.pull_request.number }} opened"